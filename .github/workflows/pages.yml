name: GitHub Pages に公開

# 既定のブランチに push すると、リポジトリ全体を GitHub Pages に公開する。
# configure-pages の enablement で、Pages が未設定なら有効化を試みる（ソース＝GitHub Actions）。
# 有効化に失敗したときは README「A. 教材を公開する」の手順で Source を「GitHub Actions」にする。
on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read      # 成果物が一覧に出たかを確かめるため

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: GAS API のテスト（壊れた版を公開しない）
        run: node tests/gas.test.js
      - name: Pages の設定（未設定なら有効化）
        uses: actions/configure-pages@v6
        with:
          enablement: true
      - name: 公開するファイルをまとめる
        run: |
          mkdir -p _site/docs _site/gas _site/assets _site/vendor
          cp index.html .nojekyll _site/
          cp assets/* _site/assets/
          cp vendor/* _site/vendor/
          cp docs/*.md _site/docs/
          cp gas/Code.gs _site/gas/
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - name: 成果物が一覧に出るまで待つ（アップロード直後は反映が遅れて「0件」になることがあるため）
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in $(seq 1 30); do
            n=$(gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts?name=github-pages" --jq '.total_count' 2>/dev/null || echo 0)
            echo "確認 $i 回目：成果物 ${n} 件"
            if [ "${n:-0}" -ge 1 ]; then sleep 3; exit 0; fi
            sleep 4
          done
          echo "成果物がまだ一覧に出ませんが、続けて公開を試みます"
      - name: 公開
        id: deployment
        uses: actions/deploy-pages@v5
